server:
  port: 19100

eureka:
  client:
    service-url:
      defaultZone: http://eureka:19090/eureka/

spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false # 임시
        format_sql: false # 임시
        use_sql_comments: true
        default_schema: coupons
        generate_statistics: false # 임시
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: coupon
    distribution:
      percentiles-histogram:
        "[coupon_use_duration]" : true
        "[outbox_publish_duration]": true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

